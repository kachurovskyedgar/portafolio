<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Vista previa del generador de identidad visual Estudio Norte">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D3B39"/>
      <stop offset="1" stop-color="#1B8C80"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#EFE7D6"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#1C1A16" flood-opacity="0.22"/>
    </filter>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1C1A16" flood-opacity="0.28"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1C1A16" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#F2ECDF"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1330" cy="140" r="340" fill="#E9C46A" opacity="0.22"/>
  <circle cx="1450" cy="900" r="300" fill="#1B8C80" opacity="0.13"/>

  <!-- Columna izquierda -->
  <g font-family="Manrope, Segoe UI, Arial, sans-serif">
    <g transform="translate(120 132)">
      <rect width="10" height="10" rx="5" fill="#D4573A"/>
      <text x="26" y="10" font-size="17" letter-spacing="4.4" fill="#6B6459" font-weight="600">IDENTIDAD VISUAL</text>
    </g>

    <text x="120" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="94" letter-spacing="-3" fill="#14211F">Estudio Norte</text>
    <text x="122" y="322" font-size="24" fill="#6B6459">Derecho laboral con claridad.</text>

    <line x1="120" y1="378" x2="600" y2="378" stroke="#1C1A16" stroke-opacity="0.14"/>

    <g transform="translate(120 430)">
      <rect width="196" height="196" rx="50" fill="url(#mark)" filter="url(#sh2)"/>
      <text x="98" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="118" fill="#F7F2E5" letter-spacing="-4">N</text>
      <circle cx="160" cy="36" r="9" fill="#E9C46A"/>
    </g>

    <text x="352" y="480" font-family="Georgia, serif" font-size="44" fill="#14211F">Estudio</text>
    <text x="352" y="532" font-family="Georgia, serif" font-size="44" fill="#14211F">Norte<tspan fill="#D4573A">.</tspan></text>
    <text x="352" y="576" font-size="19" fill="#6B6459">Identidad · Legal · Confianza</text>
    <g transform="translate(352 600)">
      <rect width="120" height="34" rx="17" fill="#14211F"/>
      <text x="60" y="23" text-anchor="middle" font-size="13" letter-spacing="1.6" fill="#F7F2E5" font-weight="600">DESDE 2019</text>
    </g>

    <!-- Paleta -->
    <text x="120" y="722" font-size="16" letter-spacing="3.4" fill="#6B6459" font-weight="600">PALETA</text>
    <g transform="translate(120 754)">
      <g>
        <rect width="86" height="86" rx="24" fill="#0D3B39"/>
        <text x="0" y="116" font-size="15" fill="#6B6459">#0D3B39</text>
      </g>
      <g transform="translate(102 0)">
        <rect width="86" height="86" rx="24" fill="#1B8C80"/>
        <text x="0" y="116" font-size="15" fill="#6B6459">#1B8C80</text>
      </g>
      <g transform="translate(204 0)">
        <rect width="86" height="86" rx="24" fill="#E9C46A"/>
        <text x="0" y="116" font-size="15" fill="#6B6459">#E9C46A</text>
      </g>
      <g transform="translate(306 0)">
        <rect width="86" height="86" rx="24" fill="#D4573A"/>
        <text x="0" y="116" font-size="15" fill="#6B6459">#D4573A</text>
      </g>
      <g transform="translate(408 0)">
        <rect width="86" height="86" rx="24" fill="#F7F2E5" stroke="#14211F" stroke-opacity="0.18"/>
        <text x="0" y="116" font-size="15" fill="#6B6459">#F7F2E5</text>
      </g>
    </g>

    <g transform="translate(120 916)">
      <text font-family="Georgia, serif" font-size="42" fill="#14211F">Aa</text>
      <text x="78" y="-8" font-size="18" fill="#14211F">Fraunces</text>
      <text x="78" y="20" font-size="15" fill="#6B6459">Títulos con carácter</text>
      <text x="300" y="-8" font-size="18" fill="#14211F">Manrope</text>
      <text x="300" y="20" font-size="15" fill="#6B6459">Texto que se lee solo</text>
    </g>
  </g>

  <!-- Tarjetas -->
  <g transform="translate(1064 214) rotate(-5)" filter="url(#sh)">
    <rect width="452" height="286" rx="26" fill="url(#paper)"/>
    <g transform="translate(40 40)">
      <rect width="58" height="58" rx="16" fill="url(#mark)"/>
      <text x="29" y="41" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#F7F2E5">N</text>
      <text x="78" y="26" font-family="Georgia, serif" font-size="24" fill="#14211F">Estudio Norte</text>
      <text x="78" y="49" font-size="13" letter-spacing="2.6" fill="#6B6459">ABOGACÍA LABORAL</text>
    </g>
    <line x1="40" y1="132" x2="412" y2="132" stroke="#14211F" stroke-opacity="0.12"/>
    <g font-family="Manrope, Segoe UI, Arial, sans-serif" fill="#5F594F" font-size="15">
      <text x="40" y="168">Av. San Martín 1240 · Piso 4</text>
      <text x="40" y="196">Mendoza, Argentina</text>
      <text x="40" y="236" fill="#14211F" font-weight="600" font-size="17">hola@estudionorte.com</text>
    </g>
    <circle cx="388" cy="228" r="30" fill="#0D3B39"/>
    <path d="M374 228h28M392 218l10 10-10 10" stroke="#F7F2E5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(996 560) rotate(4)" filter="url(#sh)">
    <rect width="480" height="318" rx="26" fill="#12211F"/>
    <circle cx="392" cy="64" r="112" fill="#1B8C80" opacity="0.32"/>
    <circle cx="392" cy="64" r="74" fill="#1B8C80" opacity="0.28"/>
    <text x="44" y="82" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3.2" fill="#8FB6AE">ESTUDIO NORTE</text>
    <text x="44" y="176" font-family="Georgia, serif" font-size="76" fill="#F7F2E5" letter-spacing="-2">Claridad</text>
    <text x="44" y="250" font-family="Georgia, serif" font-size="76" fill="#E9C46A" letter-spacing="-2" font-style="italic">legal.</text>
    <g transform="translate(44 276)">
      <rect width="104" height="30" rx="15" fill="#F7F2E5"/>
      <text x="52" y="20" text-anchor="middle" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.4" fill="#12211F" font-weight="700">SITIO WEB</text>
    </g>
  </g>
</svg>
