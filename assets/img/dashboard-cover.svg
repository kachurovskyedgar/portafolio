      <stop offset="1" stop-color="#FF4D3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0A0807"/>
  <circle cx="1100" cy="120" r="520" fill="url(#glow)"/>
  <circle cx="200" cy="920" r="420" fill="#FF7A59" opacity="0.05"/>

