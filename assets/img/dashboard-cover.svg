<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Vista previa del panel de ventas con métricas y gráficos">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF4D3D" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF4D3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
